services:
  - type: web
    name: dbs-pnl-multiuser
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dbs-pnl-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador DBS

databases:
  - name: dbs-pnl-postgres
    region: ohio
    plan: basic_256mb
    databaseName: dbs_pnl
    user: dbs_pnl
